<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="description" content="Chiffre d'affaires par région" />
    <meta name="author" content="Eldis Ymeraj et Redwan Omari">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Régions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/morph/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        #total {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }
        .chart-tooltip {
            position: absolute;
            text-align: center;
            padding: 8px;
            font: 14px sans-serif;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
        }
        .bar {
            fill: #6a5acd; 
            cursor: pointer;
        }
        .bar:hover {
            fill:darkviolet 
        }
        .selected-bar {
            fill: crimson; 
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="nav mb-4 nav-pills flex-column flex-sm-row">
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="index.html">Index</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="france.html">Carte</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="prestation.html">Préstation</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="regions.html">Région</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="departements.html">Départements</a>
    </nav>

    <div id="total" class="container mb-4">
        <div id="content"></div>
        <div class="histogramme">
            <h3 class="text-center">Chiffre d'affaires par région (Histogramme)</h3>
        </div>
    </div>

    <script src="js/d3.v7.min.js"></script>
    <script src="js/graphqlQueries.js"></script>
    <script>
        const margin = { top: 30, right: 50, bottom: 180, left: 100 },
            width = 1000 - margin.left - margin.right,  
            height = 600 - margin.top - margin.bottom;

        const x = d3.scaleBand()
            .range([0, width])
            .padding(0.3); 
        const y = d3.scaleLinear()
            .range([height, 0]);

        const svg = d3.select(".histogramme").append("svg")
            .attr("id", "svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);

        const div = d3.select("body").append("div")
            .attr("class", "chart-tooltip");

        let selectedRegion = null;

        const graphqlQuery = regionsGlobal();
        d3.json(`http://127.0.0.1:4000/?query=${encodeURIComponent(graphqlQuery)}`)
            .then(data => {
                const regionsData = data.data.regions;
                const listx = regionsData.map(d => d.nom);
                const listy = regionsData.map(d => d.sum);

                x.domain(listx);
                y.domain([0, d3.max(listy)]);

                svg.append("g")
                    .attr("transform", `translate(0, ${height})`)
                    .call(d3.axisBottom(x).tickSize(0))
                    .selectAll("text")
                    .style("text-anchor", "end")
                    .attr("dx", "-.8em")
                    .attr("dy", ".15em")
                    .attr("transform", "rotate(-45)") 
                    .style("font-size", "12px");

                svg.append("g")
                    .call(d3.axisLeft(y).ticks(10));

                svg.selectAll(".bar")
                    .data(regionsData)
                    .enter().append("rect")
                    .attr("class", "bar")
                    .attr("x", d => x(d.nom))
                    .attr("width", x.bandwidth())
                    .attr("y", d => y(d.sum))
                    .attr("height", d => height - y(d.sum))
                    .on("mouseover", function (event, d) {
                        div.transition()
                            .duration(200)
                            .style("opacity", .9);
                        div.html(`<b>Région :</b> ${d.nom}<br><b>Chiffre d'affaires :</b> ${d.sum.toLocaleString()} €`)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 50) + "px");
                    })
                    .on("mouseout", function () {
                        div.transition()
                            .duration(500)
                            .style("opacity", 0);
                    })
                    .on("click", function (event, d) {
                        d3.selectAll(".bar").classed("selected-bar", false);
                        if (selectedRegion === d.nom) {
                            selectedRegion = null;
                        } else {
                            d3.select(this).classed("selected-bar", true);
                            selectedRegion = d.nom;
                        }
                    });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
