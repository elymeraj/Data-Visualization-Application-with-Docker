<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="description" content="Chiffre d'affaires total par département" />
    <meta name="author" content="Eldis Ymeraj et Redwan Omari">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Départements</title>

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/morph/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/d3.v7.min.js"></script>
    <script src="js/graphqlQueries.js"></script>

    <style>
        .chart-tooltip {
            position: absolute;
            text-align: center;
            padding: 2px;
            font: 12px sans-serif;
            background: lightsteelblue;
            border: 0px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
        }
        .bar {
            fill: #6a5acd; 
            cursor: pointer;
        }
        .bar:hover {
            fill: darkviolet;
        }
        .selected-bar {
            fill: crimson; 
        }
    </style>
</head>
<body>
    <nav class="nav mb-4 nav-pills flex-column flex-sm-row">
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="index.html">Index</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="france.html">France</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="prestation.html">Préstation</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="regions.html">Région</a>
        <a class="link-dark flex-sm-fill text-lg-center nav-link" href="departements.html">Départements</a>
    </nav>

    <div class="container mb-3 text-center">
        <button class="btn btn-primary" id="sortAsc">Trier par ordre croissant</button>
        <button class="btn btn-secondary" id="sortDesc">Trier par ordre décroissant</button>
        <button class="btn btn-info" id="resetOrder">Réinitialiser l'ordre</button>
    </div>

    <div id="total" class="container">
        <h3 class="text-center">Chiffre d'affaires total par département</h3>
        <div id="histogram" class="histogramme"></div>
    </div>

    <script>
        // inspired by https://d3-graph-gallery.com/graph/barplot_basic.html
        // set the dimensions and margins of the graph
        const margin = { top: 20, right: 30, bottom: 200, left: 150 },
            width = 1200 - margin.left - margin.right,
            height = 700 - margin.top - margin.bottom;

        const x = d3.scaleBand().range([0, width]).padding(0.3); 
        const y = d3.scaleLinear().range([height, 0]);

        const svg = d3.select("#histogram").append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const div = d3.select("body").append("div")
            .attr("class", "chart-tooltip");

        let departmentsData, initialOrder;

        const drawHistogram = (data) => {
            x.domain(data.map(d => d.nom));
            y.domain([0, d3.max(data, d => d.sum)]);

            svg.selectAll("*").remove();

            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).tickSize(0))
                .selectAll("text")
                .style("text-anchor", "end")
                .attr("dx", "-.8em")
                .attr("dy", ".15em")
                .attr("transform", "rotate(-45)")
                .style("font-size", "12px");

            svg.append("g").call(d3.axisLeft(y).ticks(10));

            svg.selectAll(".bar")
                .data(data)
                .enter().append("rect")
                .attr("class", "bar")
                .attr("x", d => x(d.nom))
                .attr("width", x.bandwidth()) 
                .attr("y", d => y(d.sum))
                .attr("height", d => height - y(d.sum))
                .on("mouseover", function (event, d) {
                    div.transition().duration(200).style("opacity", .9);
                    div.html(`<b>Département :</b> ${d.nom}<br><b>Chiffre d'affaires :</b> ${d.sum} €`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 50) + "px");
                })
                .on("mouseout", function () {
                    div.transition().duration(500).style("opacity", 0);
                });
        };

        const graphqlQuery = departmentsGlobal();
        // Parse the Data
        //d3.csv("https://raw.githubusercontent.com/holtzy/data_to_viz/master/Example_dataset/7_OneCatOneNum_header.csv").then( function(data) {
        d3.json(`http://127.0.0.1:4000/?query=${encodeURIComponent(graphqlQuery)}`)
            .then(response => {
                departmentsData = response.data.departments;
                initialOrder = [...departmentsData]; 
                drawHistogram(departmentsData);

                document.getElementById("sortAsc").addEventListener("click", () => {
                    departmentsData.sort((a, b) => a.sum - b.sum);
                    drawHistogram(departmentsData);
                });

                document.getElementById("sortDesc").addEventListener("click", () => {
                    departmentsData.sort((a, b) => b.sum - a.sum);
                    drawHistogram(departmentsData);
                });

                document.getElementById("resetOrder").addEventListener("click", () => {
                    departmentsData = [...initialOrder];
                    drawHistogram(departmentsData);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
